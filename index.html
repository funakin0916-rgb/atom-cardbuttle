<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <title>げんしカードバトル 🧪⚔️</title>
  <style>
    body{margin:0;background:#080820;overflow-x:hidden}
    #root{width:100%;min-height:100dvh}
    #loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;color:#5cf;font-family:'DotGothic16',monospace;gap:12px;padding:20px;text-align:center}
    #loading .spinner{width:32px;height:32px;border:4px solid #222;border-top:4px solid #5cf;animation:spin .8s linear infinite}
    #loading .status{font-size:12px;color:#888;margin-top:8px;max-width:280px;line-height:1.5}
    .err{color:#f44;padding:20px;font-family:monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet"/>
  <script>
    // グローバルエラーキャッチ (表示用)
    window.__errors = [];
    window.addEventListener('error', function(e){
      window.__errors.push('ERR: ' + (e.message || e) + ' @ ' + (e.filename||'') + ':' + (e.lineno||''));
    });
    window.addEventListener('unhandledrejection', function(e){
      window.__errors.push('REJ: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    // ステータス表示
    window.__setStatus = function(msg){
      var el = document.getElementById('status');
      if (el) el.textContent = msg;
    };
  </script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" onload="window.__setStatus && window.__setStatus('React OK')" onerror="window.__errors.push('React load failed')"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" onload="window.__setStatus && window.__setStatus('ReactDOM OK')" onerror="window.__errors.push('ReactDOM load failed')"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js" onload="window.__setStatus && window.__setStatus('Babel OK - JSX変換中...')" onerror="window.__errors.push('Babel load failed')"></script>
</head>
<body>
  <div id="root">
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading...</div>
      <div class="status" id="status">CDN読み込み中...</div>
    </div>
  </div>
  <script type="text/babel" src="atom-card-game.jsx" data-presets="react" data-type="module"></script>
  <script>
    (function waitAndMount(tries){
      tries = tries || 0;
      if (window.__App && window.ReactDOM) {
        try {
          window.__setStatus && window.__setStatus('起動中...');
          const root = ReactDOM.createRoot(document.getElementById('root'));
          root.render(React.createElement(window.__App));
        } catch(e) {
          document.getElementById('root').innerHTML = '<div class="err">起動エラー: ' + (e.message||e) + '\n\n' + (e.stack||'').substring(0,500) + '</div>';
        }
      } else if (tries < 600) {  // 30秒 (50ms × 600)
        if (tries % 20 === 0) {  // 1秒ごとに更新
          var msg = 'JSX変換中... (' + Math.floor(tries*50/1000) + 's)';
          if (window.__errors && window.__errors.length) {
            msg += '\n' + window.__errors.slice(-2).join('\n');
          }
          window.__setStatus && window.__setStatus(msg);
        }
        setTimeout(function(){ waitAndMount(tries+1); }, 50);
      } else {
        var errList = (window.__errors && window.__errors.length) ? window.__errors.join('\n') : '(エラー情報なし)';
        var hasReact = !!window.React;
        var hasReactDOM = !!window.ReactDOM;
        var hasBabel = !!window.Babel;
        var hasApp = !!window.__App;
        var status = 'React:' + hasReact + ' ReactDOM:' + hasReactDOM + ' Babel:' + hasBabel + ' App:' + hasApp;
        document.getElementById('root').innerHTML = '<div class="err">Failed to load app.\n\n[Status]\n' + status + '\n\n[Errors]\n' + errList + '</div>';
      }
    })();
  </script>
</body>
</html>
